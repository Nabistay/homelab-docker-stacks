services:
### TORRENTS ###
# PROXY
  gluetun:
    # Container Info
    image: qmcgaw/gluetun
    container_name: gluetun
    restart: unless-stopped
    # Resources
    devices:
      - /dev/net/tun:/dev/net/tun
    ports:
      - 8080:8080
      - 8888:8888
    cap_add:
      - NET_ADMIN
    # # Validation
    # healthcheck:
    #   test: ["CMD", "wget", "-qO-", "https://1.1.1.1"] # Pings Cloudflare to verify internet
    #   interval: 10s
    #   timeout: 5s
    #   retries: 3
    #   start_period: 10s
    # Configuration
    environment:
      # VPN config
      - VPN_SERVICE_PROVIDER=protonvpn
      - VPN_TYPE=wireguard
      - WIREGUARD_ADDRESSES=10.2.0.2/32
      - WIREGUARD_PRIVATE_KEY=${WIREGUARD_PRIVATE_KEY}
      - FIREWALL=off
      - SERVER_COUNTRIES=Switzerland,Spain
      - PROTONVPN_NETSHIELD_LEVEL=0
      # Port Forwarding
      - VPN_PORT_FORWARDING=on
      - VPN_PORT_FORWARDING_PROVIDER=protonvpn
      - VPN_PORT_FORWARDING_UP_COMMAND=/bin/sh -c '/usr/bin/wget -O- --retry-connrefused --post-data "json={\"listen_port\":{{PORTS}}}" http://127.0.0.1:8080/api/v2/app/setPreferences 2>&1' 
      # HTTP Proxy
      - HTTPPROXY=on

  # Captcha Handler
  flaresolverr:
    # Container Info
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    restart: unless-stopped
    # Resources
    ports:
      - 8191:8191
    # Configuration
    environment:
      - LOG_LEVEL=info
      
  # seedboxapi:
  #   image: myanonamouse/seedboxapi
  #   container_name: myanonamouse-seedboxapi
  #   restart: unless-stopped
  #   network_mode: "service:gluetun"
  #   volumes:
  #     - ${CONFIG_PATH}/seedboxapi:/config
  #   environment:
  #     - DEBUG=1
  #     - mam_id=${ANONAMOUSE_SESSION_ID}
  #     - interval=1
      
  # TORRENT BOX
  qbittorrent:
    # Container Info
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    restart: unless-stopped
    depends_on:
      gluetun:
        condition: service_healthy
    # Resources
    volumes:
      - ${CONFIG_PATH}/qbittorrent:/config
      - /mnt/data/downloads:/data/downloads
      - /mnt/tmp/downloads:/data/temp-downloads
    # Configuration
    network_mode: "service:gluetun"
    environment:
      - WEBUI_PORT=8080

  # # USENET BOX
  # sabnzbd:
  #   image: lscr.io/linuxserver/sabnzbd:latest
  #   container_name: sabnzbd
  #   volumes:
  #     - ${CONFIG_PATH}sabnzbd:/config
  #     - /mnt/data/downloads:/data/downloads
  #     - /mnt/tmp/downloads:/data/temp-downloads
  #   ports:
  #     - 8081:8080
  
  ### ARRSTACK
  # Indexer Management
  prowlarr:
    # Container Info
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    restart: unless-stopped
    # Resources
    volumes:
      - ${CONFIG_PATH}/prowlarr:/config
    ports:
      - 9696:9696

  # Subtitles
  bazarr:
    # Container Info
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    restart: unless-stopped
    # Resources
    volumes:
      - ${CONFIG_PATH}/bazarr:/config
      - /mnt/data/library/tv:/data/library/tv
      - /mnt/data/library/movies:/data/library/movies
    ports:
      - 6767:6767

  # Frontend
  seerr:
    # Container Info
    image: ghcr.io/seerr-team/seerr:latest
    container_name: seerr
    restart: unless-stopped
    # Resources
    volumes:
      - ${CONFIG_PATH}/seerr:/app/config
    ports:
      - 5055:5055
    # Configuration
    init: true
    environment:
      - PORT=5055
      
  # Movies
  radarr:
    # Container Info
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    restart: unless-stopped
    # Resources
    volumes:
      - ${CONFIG_PATH}/radarr:/config
      - /mnt/data/downloads:/data/downloads
      - /mnt/data/library:/data/library
    ports:
      - 7878:7878

  # TV
  sonarr:
    # Container Info
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    restart: unless-stopped
    # Resources
    volumes:
      - ${CONFIG_PATH}/sonarr:/config
      - /mnt/data/downloads:/data/downloads
      - /mnt/data/library:/data/library
    ports:
      - 8989:8989
      
  # UNRAR FILES
  unpackerr:
    # Container Info
    image: golift/unpackerr
    container_name: unpackerr
    restart: unless-stopped
    # Resources
    volumes:
      - /mnt/data/downloads:/data/downloads
      - /mnt/data/library:/data/library
    # Configuration
    environment:
      # General config
      - UN_LOG_QUEUES=1m
      - UN_LOG_FILES=10
      - UN_LOG_FILE_MB=10
      - UN_INTERVAL=5m
      - UN_START_DELAY=1m
      - UN_RETRY_DELAY=5m
      - UN_MAX_RETRIES=3
      - UN_PARALLEL=1
      - UN_FILE_MODE=0644
      - UN_DIR_MODE=0755
      # Sonarr Config
      - UN_SONARR_0_URL=http://sonarr:8989
      - UN_SONARR_0_API_KEY=${SONARR_API_KEY}
      - UN_SONARR_0_DELETE_ORIG=false
      # Radarr Config
      - UN_RADARR_0_URL=http://radarr:7878
      - UN_RADARR_0_API_KEY=${RADARR_API_KEY}
      - UN_RADARR_0_DELETE_ORIG=false

  kapowarr:
    # Container Info
    image: mrcas/kapowarr:latest
    container_name: kapowarr
    restart: unless-stopped
    # Resources
    volumes:
      - ${CONFIG_PATH}/kapowarr/app/db:/app/db
      - /mnt/data/downloads:/data/downloads
      - /mnt/data/library/comics:/comics
    ports:
      - 5656:5656

